<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111016" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('kaio-theme') || 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta
      name="description"
      content="Kaio Amim, desenvolvedor de software. Conheça meus projetos, metodologia, trajetória e experiência com aplicações web, APIs e bancos de dados."
    />
    <meta property="og:title" content="Kaio Amim | Software Developer" />
    <meta
      property="og:description"
      content="Kaio Amim, desenvolvedor de software. Projetos, metodologia, experiência e formação em aplicações web, APIs e bancos de dados."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-kaio-six.vercel.app/" />
    <meta property="og:image" content="https://portfolio-kaio-six.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Capa roxa do portfólio de Kaio Amim, desenvolvedor de software." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portfolio-kaio-six.vercel.app/og-image.png" />
    <link rel="canonical" href="https://portfolio-kaio-six.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-ka-symbol.svg?v=ka-20261103" />
    <title>Kaio Amim | Software Developer</title>
    <style>
      #startup {
        font:
          500 clamp(21px, 4vw, 34px) / 1.4 'Segoe UI',
          Arial,
          sans-serif;
      }
      #startup > span:first-child {
        font: inherit;
      }
      html[data-theme='light'] #startup {
        background: #f7f6fb !important;
        color: #7150c6 !important;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="startup"
        role="status"
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-content: center;
          gap: 20px;
          text-align: center;
          background: #111016;
          color: #a58bff;
        "
      >
        <span>Carregando <span style="color: #a58bff">ideias</span></span
        ><span></span>
      </div>
    </div>
    <noscript
      ><style>
        #startup {
          display: none !important;
        }
      </style>
      <p>
        Ative o JavaScript para explorar o portfólio. Contato:
        <a href="mailto:kaioamim.contato@gmail.com">kaioamim.contato@gmail.com</a>
      </p></noscript
    >
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            var node = document.getElementById('startup');
            if (node) {
              node.textContent = 'Não foi possível carregar o portfólio. ';
              var link = document.createElement('a');
              link.href = '/offline.html';
              link.textContent = 'Ver opções de recuperação';
              link.style.color = 'inherit';
              node.appendChild(link);
            }
          }
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
